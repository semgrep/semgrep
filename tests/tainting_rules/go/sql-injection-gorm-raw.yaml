rules:
  - id: go-sql-injection-gorm-raw
    message: |
      Possible SQL injection via GORM Raw with dynamically constructed query.
      Query parameters from HTTP request (query.Get) flow into Raw() without sanitization.
    languages:
      - go
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  ($REQ : http.Request).$FUNC
              - pattern: |
                  ($REQ : *http.Request).$FUNC()
              - pattern: |
                  r.URL.Query()
              - pattern: |
                  r.FormValue($X)
              - pattern: |
                  r.PostFormValue($X)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(Get|GetQuery|PostForm|PostFormValue|FormValue|Form)$
      - focus-metavariable:
          - $REQ
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ($DB : gorm.DB).Raw($SQL, ...)
              - pattern-inside: |
                  ($DB : gorm.DB).Exec($SQL, ...)
              - pattern-inside: |
                  ($DB : *gorm.DB).Raw($SQL, ...)
              - pattern-inside: |
                  ($DB : *gorm.DB).Exec($SQL, ...)
              - pattern-inside: |
                  db.Raw($SQL, ...)
              - pattern-inside: |
                  db.Exec($SQL, ...)
              - pattern-inside: |
                  ($DB : any).Raw($SQL, ...)
              - pattern-inside: |
                      GORM Lib Raw($SQL, ...)
              - pattern-inside: |
                      GORM Lib Exec($SQL, ...)
          - focus-metavariable:
              - $SQL
    pattern-propagators:
      - from: $SRC
        to: $DST
        patterns:
          - pattern: |
              fmt.Sprintf($FMT, $SRC, ...)
          - metavariable-binding:
              $DST: $SRC
      - from: $SRC
        to: $DST
        patterns:
          - pattern: |
              string($SRC)
          - metavariable-binding:
              $DST: $SRC
      - from: $SRC
        to: $DST
        patterns:
          - pattern: |
              $DST := fmt.Sprintf($FMT, ..., $SRC, ...)
          - pattern: |
              $DST = fmt.Sprintf($FMT, ..., $SRC, ...)
