rules:
  - id: package-version
    languages: [csharp]
    message: Newtonsoft.Json $V
    severity: WARNING
    pattern: "#:package Newtonsoft.Json@$V"
  - id: any-sdk
    languages: [csharp]
    message: sdk $S
    severity: WARNING
    pattern: "#:sdk $S"
  - id: any-package
    languages: [csharp]
    message: package $P
    severity: WARNING
    pattern: "#:package $P"
  - id: old-version
    languages: [csharp]
    message: old Newtonsoft.Json
    severity: WARNING
    pattern: "#:package Newtonsoft.Json@1.0"
