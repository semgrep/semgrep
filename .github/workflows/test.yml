jobs:
  test-wheels-wsl:
    runs-on: windows-latest
    steps:
      - uses: Vampire/setup-wsl@v3
      - name: Install Python
        run: |
          sudo apt update -y
          sudo apt install -y make python3 python3-pip
          sudo ln -s /usr/bin/python3 /usr/bin/python
        shell: wsl-bash {0}
name: testing
on: push

