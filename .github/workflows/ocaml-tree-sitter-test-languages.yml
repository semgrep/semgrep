# AUTOGENERATED FROM ocaml-tree-sitter-test-languages.jsonnet DO NOT MODIFY
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
jobs:
  detect-changes:
    name: Detect grammar or core changes
    outputs:
      should_test: ${{ steps.filter.outputs.should_test }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - env:
          EVENT_NAME: ${{ github.event_name }}
        id: filter
        name: Filter changed paths
        run: |
          set -euo pipefail
          # Push / workflow_dispatch: this workflow's on.push.paths already
          # narrowed the run; always test.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --quiet exits 1 when any of these paths changed; 0 when none did.
          if git diff --quiet --name-only HEAD^ HEAD -- '.github/workflows/ocaml-tree-sitter-test-languages.jsonnet' '.github/workflows/ocaml-tree-sitter-test-languages.yml' '.github/workflows/ocaml-tree-sitter.libsonnet' '.gitmodules' 'libs/ocaml-tree-sitter-semgrep' 'libs/ocaml-tree-sitter-semgrep/core' 'libs/ocaml-tree-sitter-semgrep/lang'; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          fi
    timeout-minutes: 5
  enumerate:
    if: ${{ needs.detect-changes.outputs.should_test == 'true' }}
    name: Enumerate languages
    needs: detect-changes
    outputs:
      languages: ${{ steps.list.outputs.languages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Checkout ocaml-tree-sitter-semgrep submodule
        run: git submodule update --init --depth 1 libs/ocaml-tree-sitter-semgrep
        working-directory: ${{ github.workspace }}
      - id: list
        run: |
          set -euo pipefail
          echo "languages=$(lang/scripts/list-languages | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
        working-directory: libs/ocaml-tree-sitter-semgrep
    timeout-minutes: 5
  test-language:
    name: test-lang ${{ matrix.language }}
    needs: enumerate
    runs-on: ${{ (matrix.language == 'c-sharp-pro' || matrix.language == 'c-sharp' || matrix.language == 'hack') && fromJSON('{"group":"Default Larger Runners","labels":"ubuntu-latest-8-core"}') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Checkout ocaml-tree-sitter-semgrep submodule
        run: git submodule update --init --depth 1 libs/ocaml-tree-sitter-semgrep
        working-directory: ${{ github.workspace }}
      - uses: semgrep/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v5-${{ hashFiles('libs/ocaml-tree-sitter-semgrep/core/*.opam') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          save-opam-post-run: true
      - name: Rewrite SSH grammar URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Provision the upstream grammar submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8
        working-directory: libs/ocaml-tree-sitter-semgrep
      - id: cache-id
        run: |
          echo "sha=$(git rev-parse HEAD:libs/ocaml-tree-sitter-semgrep)" >> "$GITHUB_OUTPUT"
          echo "ocaml=$(opam exec -- ocamlc -version)" >> "$GITHUB_OUTPUT"
      - id: ts-versions
        run: |
          echo "versions=$(./lang/scripts/ts-versions | tr '\n' '-')" >> "$GITHUB_OUTPUT"
        working-directory: libs/ocaml-tree-sitter-semgrep
      - id: ts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
      - run: ./core/scripts/provision-tree-sitter-all
        working-directory: libs/ocaml-tree-sitter-semgrep
      - if: steps.ts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
      - id: core-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: core-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}
          path: |-
            libs/ocaml-tree-sitter-semgrep/core/_build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - name: Setup
        run: opam exec -- make setup
        working-directory: libs/ocaml-tree-sitter-semgrep
      - name: Install
        run: opam exec -- make install
        working-directory: libs/ocaml-tree-sitter-semgrep
      - if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: core-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}
          path: |-
            libs/ocaml-tree-sitter-semgrep/core/_build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - name: test-lang ${{ matrix.language }}
        run: |
          set -euo pipefail
          eval "$(opam env)"
          cd lang
          ./test-lang "${{ matrix.language }}"
        working-directory: libs/ocaml-tree-sitter-semgrep
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.enumerate.outputs.languages) }}
      max-parallel: 8
    timeout-minutes: 60
  test-languages:
    if: always() && !cancelled()
    name: Test Grammars
    needs:
      - detect-changes
      - test-language
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECT: ${{ needs.detect-changes.result }}
          RESULT: ${{ needs.test-language.result }}
          SHOULD_TEST: ${{ needs.detect-changes.outputs.should_test }}
        name: All languages passed
        run: |
          set -euo pipefail
          echo "detect-changes=$DETECT should_test=$SHOULD_TEST matrix=$RESULT"
          if [ "$DETECT" != "success" ]; then
            exit 1
          fi
          if [ "$SHOULD_TEST" != "true" ]; then
            echo "No grammar, core, or workflow changes; skipping"
            exit 0
          fi
          test "$RESULT" = "success"
name: Test Grammars in ocaml-tree-sitter-semgrep
on:
  pull_request: {}
  push:
    branches:
      - develop
    paths:
      - .github/workflows/ocaml-tree-sitter-test-languages.jsonnet
      - .github/workflows/ocaml-tree-sitter-test-languages.yml
      - .github/workflows/ocaml-tree-sitter.libsonnet
      - .gitmodules
      - libs/ocaml-tree-sitter-semgrep
      - libs/ocaml-tree-sitter-semgrep/core/**
      - libs/ocaml-tree-sitter-semgrep/lang/**
  workflow_dispatch: null
