# AUTOGENERATED FROM ocaml-tree-sitter-test-languages.jsonnet DO NOT MODIFY
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
jobs:
  detect-changes:
    name: Detect grammar or core changes
    outputs:
      should_test: ${{ steps.filter.outputs.should_test }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - env:
          EVENT_NAME: ${{ github.event_name }}
        id: filter
        name: Filter changed paths
        run: |
          set -euo pipefail
          # Push / workflow_dispatch: this workflow's on.push.paths already
          # narrowed the run; always test.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --quiet exits 1 when any of these paths changed; 0 when none did.
          if git diff --quiet --name-only HEAD^ HEAD -- '*.opam' '.github/workflows/libs/actions.libsonnet' '.github/workflows/libs/semgrep.libsonnet' '.github/workflows/libs/uses.libsonnet' '.github/workflows/ocaml-tree-sitter-test-languages.jsonnet' '.github/workflows/ocaml-tree-sitter-test-languages.yml' '.github/workflows/ocaml-tree-sitter.libsonnet' 'Makefile' 'cli/pyproject.toml' 'cli/uv.lock' 'dune-project' 'dune-workspace' 'libs/ocaml-tree-sitter-semgrep/Makefile' 'libs/ocaml-tree-sitter-semgrep/core' 'libs/ocaml-tree-sitter-semgrep/dune' 'libs/ocaml-tree-sitter-semgrep/lang' 'libs/ocaml-tree-sitter-semgrep/scripts' 'opam-lockfiles/*.locked' 'tree-sitter-config.mk' 'tree-sitter-config.sh'; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          fi
    timeout-minutes: 5
  enumerate:
    if: ${{ needs.detect-changes.outputs.should_test == 'true' }}
    name: Enumerate languages and prepare tools
    needs: detect-changes
    outputs:
      languages: ${{ steps.list.outputs.languages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true
      - id: list
        run: |
          set -euo pipefail
          echo "languages=$(scripts/list-languages | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
        working-directory: libs/ocaml-tree-sitter-semgrep
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        uses: semgrep/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v6-${{ hashFiles('opam-lockfiles/*.locked', 'OSS/opam-lockfiles/*.locked') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git#78d29aba187e8362b8ab86c189790c0af9153d4b
          save-opam-post-run: true
      - id: cache-id
        run: |
          echo "sha=$(git rev-parse HEAD:libs/ocaml-tree-sitter-semgrep/core)" >> "$GITHUB_OUTPUT"
          echo "ocaml=$(opam exec -- ocamlc -version)" >> "$GITHUB_OUTPUT"
      - id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: grammar-core-v2-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}-${{ hashFiles('*.opam', '.github/workflows/libs/actions.libsonnet', '.github/workflows/libs/semgrep.libsonnet', '.github/workflows/libs/uses.libsonnet', 'Makefile', 'cli/pyproject.toml', 'cli/uv.lock', 'dune-project', 'dune-workspace', 'opam-lockfiles/*.locked', 'tree-sitter-config.mk', 'tree-sitter-config.sh') }}
          path: |-
            _build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - name: Install repository dependencies
        run: opam exec -- make install-deps
        working-directory: libs/ocaml-tree-sitter-semgrep/../..
      - name: Build grammar tools
        run: opam exec -- make grammar-tools
        working-directory: libs/ocaml-tree-sitter-semgrep/../..
      - if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: grammar-core-v2-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}-${{ hashFiles('*.opam', '.github/workflows/libs/actions.libsonnet', '.github/workflows/libs/semgrep.libsonnet', '.github/workflows/libs/uses.libsonnet', 'Makefile', 'cli/pyproject.toml', 'cli/uv.lock', 'dune-project', 'dune-workspace', 'opam-lockfiles/*.locked', 'tree-sitter-config.mk', 'tree-sitter-config.sh') }}
          path: |-
            _build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - id: ts-versions
        name: Resolve pinned tree-sitter versions
        run: |
          echo "versions=$(./scripts/ts-versions | tr '\n' '-')" >> "$GITHUB_OUTPUT"
        working-directory: libs/ocaml-tree-sitter-semgrep
      - id: ts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
      - name: Setup tree-sitter versions
        run: ./core/scripts/provision-tree-sitter-all
        working-directory: libs/ocaml-tree-sitter-semgrep
      - if: steps.ts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
    timeout-minutes: 60
  test-language:
    name: test-lang ${{ matrix.language }}
    needs: enumerate
    runs-on: ${{ (matrix.language == 'c-sharp-pro' || matrix.language == 'c-sharp' || matrix.language == 'hack') && fromJSON('{"group":"Default Larger Runners","labels":"ubuntu-latest-8-core"}') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          lfs: true
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        uses: semgrep/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v6-${{ hashFiles('opam-lockfiles/*.locked', 'OSS/opam-lockfiles/*.locked') }}
          ocaml-compiler: ocaml-variants.5.4.0+options,ocaml-option-flambda
          opam-pin: false
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git#78d29aba187e8362b8ab86c189790c0af9153d4b
          save-opam-post-run: true
      - id: cache-id
        run: |
          echo "sha=$(git rev-parse HEAD:libs/ocaml-tree-sitter-semgrep/core)" >> "$GITHUB_OUTPUT"
          echo "ocaml=$(opam exec -- ocamlc -version)" >> "$GITHUB_OUTPUT"
      - id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: grammar-core-v2-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}-${{ hashFiles('*.opam', '.github/workflows/libs/actions.libsonnet', '.github/workflows/libs/semgrep.libsonnet', '.github/workflows/libs/uses.libsonnet', 'Makefile', 'cli/pyproject.toml', 'cli/uv.lock', 'dune-project', 'dune-workspace', 'opam-lockfiles/*.locked', 'tree-sitter-config.mk', 'tree-sitter-config.sh') }}
          path: |-
            _build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - name: Install repository dependencies
        run: opam exec -- make install-deps
        working-directory: libs/ocaml-tree-sitter-semgrep/../..
      - name: Build grammar tools
        run: opam exec -- make grammar-tools
        working-directory: libs/ocaml-tree-sitter-semgrep/../..
      - if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: grammar-core-v2-${{ runner.os }}-${{ steps.cache-id.outputs.ocaml }}-${{ steps.cache-id.outputs.sha }}-${{ hashFiles('*.opam', '.github/workflows/libs/actions.libsonnet', '.github/workflows/libs/semgrep.libsonnet', '.github/workflows/libs/uses.libsonnet', 'Makefile', 'cli/pyproject.toml', 'cli/uv.lock', 'dune-project', 'dune-workspace', 'opam-lockfiles/*.locked', 'tree-sitter-config.mk', 'tree-sitter-config.sh') }}
          path: |-
            _build
            libs/ocaml-tree-sitter-semgrep/core/bin
      - id: ts-versions
        name: Resolve pinned tree-sitter versions
        run: |
          echo "versions=$(./scripts/ts-versions | tr '\n' '-')" >> "$GITHUB_OUTPUT"
        working-directory: libs/ocaml-tree-sitter-semgrep
      - id: ts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
      - name: Setup tree-sitter versions
        run: ./core/scripts/provision-tree-sitter-all
        working-directory: libs/ocaml-tree-sitter-semgrep
      - if: steps.ts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: tree-sitter-${{ runner.os }}-${{ steps.ts-versions.outputs.versions }}-${{ steps.cache-id.outputs.sha }}
          path: libs/ocaml-tree-sitter-semgrep/core/tree-sitter-*.*.*
      - name: test-lang ${{ matrix.language }}
        run: |
          set -euo pipefail
          eval "$(opam env)"
          cd lang
          ./test-lang "${{ matrix.language }}"
        working-directory: libs/ocaml-tree-sitter-semgrep
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.enumerate.outputs.languages) }}
      max-parallel: 8
    timeout-minutes: 60
  test-languages:
    if: always() && !cancelled()
    name: Test Grammars
    needs:
      - detect-changes
      - test-language
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECT: ${{ needs.detect-changes.result }}
          RESULT: ${{ needs.test-language.result }}
          SHOULD_TEST: ${{ needs.detect-changes.outputs.should_test }}
        name: All languages passed
        run: |
          set -euo pipefail
          echo "detect-changes=$DETECT should_test=$SHOULD_TEST matrix=$RESULT"
          if [ "$DETECT" != "success" ]; then
            exit 1
          fi
          if [ "$SHOULD_TEST" != "true" ]; then
            echo "No grammar, core, or workflow changes; skipping"
            exit 0
          fi
          test "$RESULT" = "success"
name: Test Grammars in ocaml-tree-sitter-semgrep
on:
  pull_request: {}
  push:
    branches:
      - develop
    paths:
      - '*.opam'
      - .github/workflows/libs/actions.libsonnet
      - .github/workflows/libs/semgrep.libsonnet
      - .github/workflows/libs/uses.libsonnet
      - .github/workflows/ocaml-tree-sitter-test-languages.jsonnet
      - .github/workflows/ocaml-tree-sitter-test-languages.yml
      - .github/workflows/ocaml-tree-sitter.libsonnet
      - Makefile
      - cli/pyproject.toml
      - cli/uv.lock
      - dune-project
      - dune-workspace
      - libs/ocaml-tree-sitter-semgrep/Makefile
      - libs/ocaml-tree-sitter-semgrep/core/**
      - libs/ocaml-tree-sitter-semgrep/dune
      - libs/ocaml-tree-sitter-semgrep/lang/**
      - libs/ocaml-tree-sitter-semgrep/scripts/**
      - opam-lockfiles/*.locked
      - tree-sitter-config.mk
      - tree-sitter-config.sh
  workflow_dispatch: null
