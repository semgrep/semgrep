# AUTOGENERATED FROM scanner-memory-safety.jsonnet DO NOT MODIFY
jobs:
  scanner-memory-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - env:
          EVENT_NAME: ${{ github.event_name }}
        id: changes
        name: Check whether scanner files changed
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Not a pull request; running the test"
            echo "scanners=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request, checkout's HEAD is GitHub's merge commit, so
          # HEAD^ is the tip of the base branch.
          changed=$(git diff --no-renames --name-only HEAD^ HEAD -- ':(top,glob)languages/*/tree-sitter/semgrep-*/lib/scanner.*' ':(top,glob)languages/*/tree-sitter/semgrep-*/lib/tree_sitter/**' ':(top,glob)libs/ocaml-tree-sitter-semgrep/lang/semgrep-grammars/src/semgrep-ruby/src/scanner.c' ':(top,glob)libs/ocaml-tree-sitter-semgrep/scripts/test_scanner_memory_safety.py' ':(top,glob).github/workflows/scanner-memory-safety.yml' ':(top,glob).github/workflows/scanner-memory-safety.jsonnet')
          if [ -n "$changed" ]; then
            printf 'Scanner files changed:\n%s\n' "$changed"
            echo "scanners=true" >> "$GITHUB_OUTPUT"
          else
            echo "No scanner files changed; skipping the test"
            echo "scanners=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.scanners == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: auto
          python-version: "3.12"
          version: 0.10.9
      - if: steps.changes.outputs.scanners == 'true'
        name: Run scanners under AddressSanitizer
        run: uv run --project cli --locked pytest -v libs/ocaml-tree-sitter-semgrep/scripts/test_scanner_memory_safety.py
        working-directory: .
    timeout-minutes: 15
name: Scanner memory safety
on:
  pull_request: {}
  push:
    branches:
      - develop
